<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#3f2a1d" />
    <title>Album Vasant Kunj | Digital Flipbook</title>
    <style>
      :root {
        --ink: #3f2a1d;
        --paper: #f7f1e8;
        --accent: #a86c3b;
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        min-height: 100vh;
        background: radial-gradient(circle at top, #fffaf2, #e8ddcf 75%);
        color: var(--ink);
        font-family: Arial, Helvetica, sans-serif;
      }
      header {
        padding: 22px 16px 12px;
        text-align: center;
      }
      h1 {
        margin: 0;
        font-family: Georgia, serif;
        font-size: clamp(1.5rem, 4vw, 2.4rem);
        font-weight: 600;
      }
      .subtitle {
        margin: 8px 0 0;
        color: #795d48;
        font-size: 0.95rem;
      }
      main {
        width: 100%;
        padding: 12px 12px 28px;
        display: flex;
        flex-direction: column;
        align-items: center;
      }
      #status {
        margin: 8px 0 18px;
        text-align: center;
        color: #795d48;
        font-size: 0.95rem;
      }
      #book-wrap {
width: 98vw;
max-width: 1600px;
min-height: 70vh;
display: flex;
align-items: center;
justify-content: center;
margin: 0 auto;
}

#book-wrap .stf__parent {
margin: 0 auto;
}

      #book {
        margin: 0 auto;
      }
      .page {
        background: #fff;
        overflow: hidden;
      }
      .page canvas {
        width: 100%;
        height: 100%;
        display: block;
        object-fit: contain;
      }
      .controls {
        display: flex;
        align-items: center;
        justify-content: center;
        flex-wrap: wrap;
        gap: 10px;
        margin-top: 20px;
      }
      button {
        border: 0;
        border-radius: 7px;
        background: var(--ink);
        color: white;
        padding: 11px 16px;
        font-size: 0.95rem;
        cursor: pointer;
      }
      button:hover {
        background: #69472f;
      }
      button:disabled {
        opacity: 0.4;
        cursor: not-allowed;
      }
      #page-count {
        min-width: 105px;
        text-align: center;
        font-variant-numeric: tabular-nums;
      }
      .hint {
        text-align: center;
        color: #795d48;
        font-size: 0.85rem;
        margin: 14px 0 0;
      }
      footer {
        text-align: center;
        color: #8a7562;
        font-size: 0.78rem;
        padding: 0 12px 20px;
      }
      .error {
        color: #9d2727 !important;
        max-width: 700px;
        line-height: 1.5;
      }
      @media (max-width: 600px) {
        header {
          padding-top: 18px;
        }
        #book-wrap {
          width: 100%;
          min-height: 230px;
        }
        button {
          padding: 10px 13px;
        }
      }
    </style>
  </head>
  <body>
    <header>
      <h1>शोधपरिसंवादः </h1>
      <p class="subtitle">( Research Colloquia) </p>
    </header>
    <main>
      <div id="status">Preparing your book…</div>
      <div id="book-wrap"><div id="book"></div></div>
      <div class="controls" aria-label="Book controls">
        <button id="first" disabled>⏮ First</button>
        <button id="prev" disabled>← Previous</button>
        <span id="page-count">Page — / —</span>
        <button id="next" disabled>Next →</button>
        <button id="last" disabled>Last ⏭</button>
        <button id="fullscreen">⛶ Fullscreen</button>
      </div>
      <p class="hint">
        Turn pages by clicking or dragging a corner. On mobile, swipe to turn
        pages.
      </p>
    </main>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/page-flip@2.0.7/dist/js/page-flip.browser.min.js"></script>
    <script>
      pdfjsLib.GlobalWorkerOptions.workerSrc =
        "https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js";
      const statusEl = document.getElementById("status");
      const pageCountEl = document.getElementById("page-count");
      const bookEl = document.getElementById("book");
      const buttons = ["first", "prev", "next", "last"].map((id) =>
        document.getElementById(id),
      );
      let flipbook;

      function updateControls() {
        if (!flipbook) return;
        const current = flipbook.getCurrentPageIndex();
        const total = flipbook.getPageCount();
        pageCountEl.textContent = `Page ${current + 1} / ${total}`;
        document.getElementById("first").disabled = current === 0;
        document.getElementById("prev").disabled = current === 0;
        document.getElementById("next").disabled = current >= total - 1;
        document.getElementById("last").disabled = current >= total - 1;
      }

      async function buildFlipbook() {
        try {
          const pdf = await pdfjsLib.getDocument({ url: "./book.pdf" }).promise;
          const pageElements = [];
         const targetWidth = Math.min(1100, Math.max(500, window.innerWidth * 0.7));
          for (let pageNo = 1; pageNo <= pdf.numPages; pageNo++) {
            statusEl.textContent = `Loading page ${pageNo} of ${pdf.numPages}…`;
            const page = await pdf.getPage(pageNo);
            const base = page.getViewport({ scale: 1 });
            const scale = targetWidth / base.width;
            const viewport = page.getViewport({ scale });
            const canvas = document.createElement("canvas");
            const context = canvas.getContext("2d", { alpha: false });
            canvas.width = Math.floor(viewport.width);
            canvas.height = Math.floor(viewport.height);
            await page.render({ canvasContext: context, viewport }).promise;
            const holder = document.createElement("div");
            holder.className = "page";
            holder.appendChild(canvas);
            pageElements.push(holder);
            page.cleanup();
          }
          statusEl.textContent = "";
          flipbook = new St.PageFlip(bookEl, {
            width: 600,
            height: 405,
            size: "stretch",
            minWidth: 350,
            maxWidth: 1100,
            minHeight: 190,
            maxHeight: 720,
            showCover: true,
            maxShadowOpacity: 0.35,
            mobileScrollSupport: true,
            usePortrait: true,
            startPage: 0,
            drawShadow: true,
            flippingTime: 700,
            autoSize: true,
          });
          flipbook.loadFromHTML(pageElements);
          flipbook.on("flip", updateControls);
          flipbook.on("init", updateControls);
          buttons.forEach((b) => (b.disabled = false));
          updateControls();
        } catch (error) {
          console.error(error);
          statusEl.className = "error";
          statusEl.textContent =
            "The book could not be loaded. Check that book.pdf is present and that you are viewing the deployed site over HTTPS.";
        }
      }

      document.getElementById("first").addEventListener("click", () => {
        flipbook?.turnToPage(0);
        updateControls();
      });
      document
        .getElementById("prev")
        .addEventListener("click", () => flipbook?.flipPrev());
      document
        .getElementById("next")
        .addEventListener("click", () => flipbook?.flipNext());
      document.getElementById("last").addEventListener("click", () => {
        if (flipbook) flipbook.turnToPage(flipbook.getPageCount() - 1);
        updateControls();
      });
      document
        .getElementById("fullscreen")
        .addEventListener("click", async () => {
          const target = document.documentElement;
          if (!document.fullscreenElement) await target.requestFullscreen?.();
          else await document.exitFullscreen?.();
        });
      buildFlipbook();
    </script>
  </body>
</html>
